# =====================================================================
# Configuracion del escaneo
# =====================================================================
# ESTE FICHERO SOLO LO LEE EL SCANNER SUELTO (`sonar-scanner`).
# El curso usa Maven (`mvn sonar:sonar`), que LEE LA CONFIG DEL pom.xml
# y NO este fichero. Lo dejamos aqui por si prefieres el scanner suelto.
#
# NUNCA aqui: la URL de tu servidor ni ningun token.
  # Se pasan por variable de entorno o por parametro en el momento:
  #   "-Dsonar.host.url=TU-SONARQUBE" "-Dsonar.token=squ_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  #   (las comillas son obligatorias en PowerShell) o bien SONAR_HOST_URL / SONAR_TOKEN
# =====================================================================

sonar.projectKey=curso-sonar-demo
sonar.projectName=Curso Sonar - Demo

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.tests=target/test-classes

# SonarQube solo LEE este informe; no calcula la cobertura.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# La URL de tu SonarQube va AQUI DELIBERADAMENTE NO: TU-SONARQUBE
# sonar.host.url=
